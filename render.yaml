services:
  # SENTINEL-X FastAPI & YOLO Video Intelligence Backend
  - type: web
    name: sentinel-x-backend
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sentinel_x
      - key: CORS_ORIGINS
        value: "*"
